dataset:
  type: tabred
  name: homecredit-default
  path: data/raw/tabred/homecredit-default
  split: default

experiment:
  model_name: linear
  window_size: 5000
  seed: 42
  methods: [swds, mean_ks, max_ks, mean_psi, max_psi, mmd_rbf, energy, c2st]
  retraining:
    enabled: true
    periods: [4, 8]
    history_modes: [all, rolling]
    rolling_history_windows: 4
    oracle_min_quality_drop: 0.02

output_dir: results/tabred/homecredit-default
