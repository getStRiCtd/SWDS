dataset:
  type: tabred
  name: sberbank-housing
  path: data/raw/tabred/sberbank-housing
  split: default

experiment:
  model_name: linear
  window_size: 500
  seed: 42
  n_jobs: -1
  swds_backend: auto
  c2st_n_jobs: 1
  methods: [swds, mean_ks, max_ks, mean_psi, max_psi, mmd_rbf, energy, c2st]
  retraining:
    enabled: true
    periods: [4, 8]
    history_modes: [all, rolling]
    rolling_history_windows: 4
    oracle_min_quality_drop: 0.02

output_dir: results/tabred/sberbank-housing
